name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Arch matches the target system: Rust, Tesseract, PySide6 and fonts from its repos.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git base-devel rust pkgconf cmake cairo \
            python pyside6 tesseract tesseract-data-eng tesseract-data-rus \
            ttf-jetbrains-mono-nerd noto-fonts noto-fonts-cjk
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Rust tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build backend
        run: cargo build --locked
      - name: Interface catalogs
        run: python3 bin/i18n-check
      - name: Installer tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: QML smoke test
        run: python3 tests/ui_smoke.py
      - name: End-to-end (real backend, Tesseract, renderer)
        run: python3 tests/integration.py
      - name: Visual regression
        # Baselines come from an Omarchy desktop; font hinting can differ on CI.
        continue-on-error: true
        run: python3 tests/visual_regression.py
      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: /tmp/omatranslate-ui
          if-no-files-found: ignore
