name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: omatranslate doctor
      description: Output of `omatranslate doctor`.
      render: json
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`pacman -Q omatranslate quickshell tesseract` and your Omarchy version"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "For install problems, attach `~/.local/state/omatranslate/last-integration.json`. For the panel: `journalctl --user -b | grep -i omatranslate`. Remove any private text first."
      render: text
